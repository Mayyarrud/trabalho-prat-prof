name: Vite Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          require-lockfile: true

      - name: Build website
        shell: bash
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          set -euo pipefail

          if [ -z "${VITE_API_URL:-}" ]; then
            echo "::error::VITE_API_URL is not configured."
            exit 1
          fi

          pnpm --filter @vai-dar-onda/frontend run build --base=./

      - name: Validate generated website
        shell: bash
        working-directory: packages/frontend
        run: |
          set -euo pipefail

          test -d "dist"
          test -f "dist/index.html"

          if find "dist" -type l -print -quit | grep -q .; then
            echo "::error::The generated site contains symbolic links."
            exit 1
          fi

          if find "dist" -type f -links +1 -print -quit | grep -q .; then
            echo "::error::The generated site contains hard links."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/frontend/dist

  deploy:
    needs:
      - build

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1